<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tính Toán Lãi Suất Ngân Hàng Việt Nam</title>
    <!-- Cấu hình PWA & Apple Touch Icon cho iPhone từ X đến 18 Pro Max -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lãi Suất Bank">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230b0f19%22/><text y=%22.7em%22 x=%2212%22 font-size=%2265%22>🏦</text></svg>">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: #05070b;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Hiệu ứng viền LED RGB 7 màu chạy quanh khung cực kỳ mượt mà */
        @keyframes rgbLedBorder {
            0% { border-color: #ff2a2a; box-shadow: 0 0 25px rgba(255, 42, 42, 0.5), inset 0 0 15px rgba(255, 42, 42, 0.2); }
            14% { border-color: #ff7f00; box-shadow: 0 0 25px rgba(255, 127, 0, 0.5), inset 0 0 15px rgba(255, 127, 0, 0.2); }
            28% { border-color: #ffd700; box-shadow: 0 0 25px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.2); }
            42% { border-color: #00e676; box-shadow: 0 0 25px rgba(0, 230, 118, 0.5), inset 0 0 15px rgba(0, 230, 118, 0.2); }
            57% { border-color: #00b0ff; box-shadow: 0 0 25px rgba(0, 176, 255, 0.5), inset 0 0 15px rgba(0, 176, 255, 0.2); }
            71% { border-color: #651fff; box-shadow: 0 0 25px rgba(101, 31, 255, 0.5), inset 0 0 15px rgba(101, 31, 255, 0.2); }
            85% { border-color: #e040fb; box-shadow: 0 0 25px rgba(224, 64, 251, 0.5), inset 0 0 15px rgba(224, 64, 251, 0.2); }
            100% { border-color: #ff2a2a; box-shadow: 0 0 25px rgba(255, 42, 42, 0.5), inset 0 0 15px rgba(255, 42, 42, 0.2); }
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: #0f172a;
            border-radius: 26px;
            border: 3.5px solid #ff2a2a;
            animation: rgbLedBorder 6s infinite linear;
            padding: 18px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 17px;
            font-weight: 900;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        header p {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fbbf24;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Danh sách Logo Ngân Hàng */
        .bank-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .bank-scroll::-webkit-scrollbar {
            display: none;
        }

        .bank-card {
            min-width: 74px;
            height: 62px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px;
        }

        .bank-card.active {
            border-color: #38bdf8;
            background: #0369a1;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            transform: scale(1.03);
        }

        .bank-card svg {
            width: 26px;
            height: 26px;
            margin-bottom: 2px;
        }

        .bank-card span {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            color: #f1f5f9;
        }

        /* Tabs Tiết Kiệm / Vay Vốn */
        .mode-tabs {
            display: flex;
            background: #1e293b;
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 14px;
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: #94a3b8;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-tab.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        /* Khung nhập liệu */
        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: #e2e8f0;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 11px 13px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 11px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        /* Nút tính toán */
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
            margin-bottom: 14px;
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        /* Khung kết quả */
        .result-box {
            background: #1e293b;
            border: 1.5px solid #334155;
            border-radius: 14px;
            padding: 14px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #334155;
        }

        .result-label {
            font-weight: 900;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .result-value {
            font-weight: 900;
            color: #38bdf8;
            font-size: 14px;
            text-transform: uppercase;
        }

        .result-value.highlight {
            color: #4ade80;
            font-size: 16px;
        }

        /* Bảng lịch trả nợ / chi tiết */
        .schedule-title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fbbf24;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        .schedule-table-container {
            max-height: 130px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 11px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 900;
            text-transform: uppercase;
            position: sticky;
            top: 0;
        }

        td {
            color: #e2e8f0;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>BỘ TÍNH TOÁN LÃI SUẤT NGÂN HÀNG</h1>
        <p>Cập nhật biểu lãi suất mới nhất Việt Nam</p>
    </header>

    <!-- Chọn Ngân Hàng -->
    <div class="section-title">CHỌN NGÂN HÀNG</div>
    <div class="bank-scroll" id="bankList"></div>

    <!-- Tabs Chế độ -->
    <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('saving')" id="tabSaving">GỬI TIẾT KIỆM</div>
        <div class="mode-tab" onclick="switchMode('loan')" id="tabLoan">VAY VỐN</div>
    </div>

    <!-- Nhập liệu -->
    <div class="input-group">
        <label id="lblAmount">SỐ TIỀN GỬI (VNĐ)</label>
        <input type="text" id="txtAmount" value="100.000.000" oninput="formatCurrency(this)">
    </div>

    <div class="input-group">
        <label>KỲ HẠN</label>
        <select id="selTerm" onchange="updateRate(); calculate();">
            <option value="1">1 Tháng</option>
            <option value="3">3 Tháng</option>
            <option value="6">6 Tháng</option>
            <option value="12" selected>12 Tháng</option>
            <option value="24">24 Tháng</option>
        </select>
    </div>

    <div class="input-group" id="groupInterestType">
        <label>HÌNH THỨC NHẬN LÃI</label>
        <select id="selInterestType" onchange="calculate()">
            <option value="maturity">CUỐI KỲ</option>
            <option value="monthly">HÀNG THÁNG</option>
            <option value="quarterly">HÀNG QUÝ</option>
        </select>
    </div>

    <div class="input-group">
        <label>LÃI SUẤT (%/NĂM) - CÓ THỂ ĐIỀU CHỈNH</label>
        <input type="number" id="txtRate" value="6.0" step="0.1" oninput="calculate()">
    </div>

    <button class="btn-calc" onclick="calculate()">TÍNH TOÁN NGAY</button>

    <!-- Kết quả -->
    <div class="result-box" id="resultContainer">
        <div class="result-row">
            <span class="result-label">LÃI SUẤT ÁP DỤNG:</span>
            <span class="result-value" id="resRate">6.0% / NĂM</span>
        </div>
        <div class="result-row">
            <span class="result-label" id="lblResMain">TỔNG TIỀN LÃI DỰ KIẾN:</span>
            <span class="result-value highlight" id="resInterest">6.000.000 VNĐ</span>
        </div>
        <div class="result-row">
            <span class="result-label" id="lblResSub">TỔNG GỐC + LÃI:</span>
            <span class="result-value" id="resTotal">106.000.000 VNĐ</span>
        </div>
        
        <div id="scheduleSection" style="display:none;">
            <div class="schedule-title" id="scheduleTitleText">LỊCH TRẢ NỢ CHI TIẾT HÀNG THÁNG</div>
            <div class="schedule-table-container">
                <table>
                    <thead>
                        <tr id="tableHeaderRow">
                            <th>THÁNG</th>
                            <th>GỐC TRẢ</th>
                            <th>LÃI TRẢ</th>
                            <th>TỔNG GỐC + LÃI</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const banks = [
        { id: 'vcb', name: 'VCB', fullName: 'Vietcombank', rateSaving: 4.7, rateLoan: 7.5, svg: '<circle cx="16" cy="16" r="14" fill="#006241"/><text x="16" y="20" font-size="9" fill="white" font-weight="900" text-anchor="middle">VCB</text>' },
        { id: 'bidv', name: 'BIDV', fullName: 'BIDV', rateSaving: 4.8, rateLoan: 7.6, svg: '<circle cx="16" cy="16" r="14" fill="#005596"/><text x="16" y="20" font-size="8.5" fill="white" font-weight="900" text-anchor="middle">BIDV</text>' },
        { id: 'agri', name: 'AGRI', fullName: 'Agribank', rateSaving: 4.8, rateLoan: 7.5, svg: '<circle cx="16" cy="16" r="14" fill="#0072bc"/><text x="16" y="20" font-size="8" fill="white" font-weight="900" text-anchor="middle">AGRI</text>' },
        { id: 'vpb', name: 'VPB', fullName: 'VPBank', rateSaving: 5.3, rateLoan: 8.2, svg: '<circle cx="16" cy="16" r="14" fill="#009a49"/><text x="16" y="20" font-size="9" fill="white" font-weight="900" text-anchor="middle">VPB</text>' },
        { id: 'hdb', name: 'HDB', fullName: 'HDBank', rateSaving: 5.2, rateLoan: 8.0, svg: '<circle cx="16" cy="16" r="14" fill="#f37021"/><text x="16" y="20" font-size="9" fill="white" font-weight="900" text-anchor="middle">HDB</text>' },
        { id: 'acb', name: 'ACB', fullName: 'ACB', rateSaving: 5.0, rateLoan: 7.8, svg: '<circle cx="16" cy="16" r="14" fill="#003781"/><text x="16" y="20" font-size="9.5" fill="white" font-weight="900" text-anchor="middle">ACB</text>' },
        { id: 'vib', name: 'VIB', fullName: 'VIB', rateSaving: 5.4, rateLoan: 8.3, svg: '<circle cx="16" cy="16" r="14" fill="#00539f"/><text x="16" y="20" font-size="9.5" fill="white" font-weight="900" text-anchor="middle">VIB</text>' },
        { id: 'sacom', name: 'SACOM', fullName: 'Sacombank', rateSaving: 5.1, rateLoan: 8.1, svg: '<circle cx="16" cy="16" r="14" fill="#00483a"/><text x="16" y="19" font-size="7" fill="white" font-weight="900" text-anchor="middle">SACOM</text>' },
        { id: 'lp', name: 'LPB', fullName: 'LPBank', rateSaving: 5.5, rateLoan: 8.5, svg: '<circle cx="16" cy="16" r="14" fill="#d32f2f"/><text x="16" y="20" font-size="9" fill="white" font-weight="900" text-anchor="middle">LPB</text>' },
        { id: 'pv', name: 'PVB', fullName: 'PVcomBank', rateSaving: 5.8, rateLoan: 8.6, svg: '<circle cx="16" cy="16" r="14" fill="#ed1c24"/><text x="16" y="20" font-size="9" fill="white" font-weight="900" text-anchor="middle">PVB</text>' },
        { id: 'bv', name: 'BVB', fullName: 'BVBank', rateSaving: 5.6, rateLoan: 8.4, svg: '<circle cx="16" cy="16" r="14" fill="#008559"/><text x="16" y="20" font-size="9" fill="white" font-weight="900" text-anchor="middle">BVB</text>' },
        { id: 'citi', name: 'CITI', fullName: 'Citibank', rateSaving: 4.5, rateLoan: 7.2, svg: '<circle cx="16" cy="16" r="14" fill="#003b70"/><text x="16" y="20" font-size="8.5" fill="white" font-weight="900" text-anchor="middle">CITI</text>' }
    ];

    let currentMode = 'saving';
    let selectedBankId = 'vpb';

    function renderBanks() {
        const container = document.getElementById('bankList');
        container.innerHTML = banks.map(b => `
            <div class="bank-card ${b.id === selectedBankId ? 'active' : ''}" onclick="selectBank('${b.id}')">
                <svg viewBox="0 0 32 32">${b.svg}</svg>
                <span>${b.name}</span>
            </div>
        `).join('');
    }

    function selectBank(id) {
        selectedBankId = id;
        renderBanks();
        updateRate();
        calculate();
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('tabSaving').classList.toggle('active', mode === 'saving');
        document.getElementById('tabLoan').classList.toggle('active', mode === 'loan');
        
        document.getElementById('lblAmount').innerText = mode === 'saving' ? 'SỐ TIỀN GỬI (VNĐ)' : 'SỐ TIỀN VAY (VNĐ)';
        document.getElementById('groupInterestType').style.display = mode === 'saving' ? 'block' : 'none';
        
        updateRate();
        calculate();
    }

    function updateRate() {
        const bank = banks.find(b => b.id === selectedBankId);
        const term = parseInt(document.getElementById('selTerm').value);
        let baseRate = currentMode === 'saving' ? bank.rateSaving : bank.rateLoan;
        
        if (term >= 12) baseRate += 0.3;
        else if (term >= 6) baseRate += 0.1;

        document.getElementById('txtRate').value = baseRate.toFixed(1);
    }

    function formatCurrency(input) {
        let value = input.value.replace(/\D/g, '');
        if (value === '') { input.value = ''; return; }
        input.value = Number(value).toLocaleString('vi-VN');
        calculate();
    }

    function getRawNumber(id) {
        return parseFloat(document.getElementById(id).value.replace(/\./g, '').replace(/,/g, '')) || 0;
    }

    function formatMoney(num) {
        return Math.round(num).toLocaleString('vi-VN') + ' VNĐ';
    }

    function calculate() {
        const principal = getRawNumber('txtAmount');
        const termMonths = parseInt(document.getElementById('selTerm').value);
        const annualRate = parseFloat(document.getElementById('txtRate').value) / 100;
        const scheduleSection = document.getElementById('scheduleSection');
        const scheduleBody = document.getElementById('scheduleBody');

        document.getElementById('resRate').innerText = (annualRate * 100).toFixed(1) + '% / NĂM';

        if (currentMode === 'saving') {
            scheduleSection.style.display = 'none';
            document.getElementById('lblResMain').innerText = 'TỔNG TIỀN LÃI DỰ KIẾN:';
            document.getElementById('lblResSub').innerText = 'TỔNG GỐC + LÃI:';

            const interestType = document.getElementById('selInterestType').value;
            let totalInterest = 0;

            if (interestType === 'maturity') {
                totalInterest = principal * annualRate * (termMonths / 12);
            } else if (interestType === 'monthly') {
                totalInterest = principal * (annualRate / 12) * termMonths;
            } else if (interestType === 'quarterly') {
                totalInterest = principal * (annualRate / 4) * (termMonths / 3);
            }

            document.getElementById('resInterest').innerText = formatMoney(totalInterest);
            document.getElementById('resTotal').innerText = formatMoney(principal + totalInterest);
        } else {
            // TÍNH VAY VỐN (Dư nợ giảm dần)
            scheduleSection.style.display = 'block';
            document.getElementById('lblResMain').innerText = 'TỔNG LÃI PHẢI TRẢ:';
            document.getElementById('lblResSub').innerText = 'TỔNG GỐC + LÃI PHẢI TRẢ:';

            let monthlyPrincipal = principal / termMonths;
            let remainingPrincipal = principal;
            let totalInterest = 0;
            let html = '';

            scheduleBody.innerHTML = '';
            for (let i = 1; i <= termMonths; i++) {
                let monthlyInterest = remainingPrincipal * (annualRate / 12);
                let totalMonthly = monthlyPrincipal + monthlyInterest;
                totalInterest += monthlyInterest;

                html += `<tr>
                    <td>THÁNG ${i}</td>
                    <td>${formatMoney(monthlyPrincipal)}</td>
                    <td>${formatMoney(monthlyInterest)}</td>
                    <td><b>${formatMoney(totalMonthly)}</b></td>
                </tr>`;
                remainingPrincipal -= monthlyPrincipal;
            }
            scheduleBody.innerHTML = html;
            document.getElementById('resInterest').innerText = formatMoney(totalInterest);
            document.getElementById('resTotal').innerText = formatMoney(principal + totalInterest);
        }
    }

    // Khởi chạy khi tải trang
    renderBanks();
    updateRate();
    calculate();
</script>

</body>
</html>
